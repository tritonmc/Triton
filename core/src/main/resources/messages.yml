error:
  no-permission: "<red>No permission. Permission required: <dark_red>%1</dark_red>"
  message-not-found: "ERROR 404: Message not found: '%1'! Args: %2"
  lang-not-found: "<red>Language <dark_red>%1</dark_red> not found! <gray><italic>Note: It's case sensitive. Use TAB to show all the available languages.</italic>"
  player-not-found-use-uuid: "<red>Player <dark_red>%1</dark_red> not found! Use UUID to search through offline players."
  proxy-reload-invalid-mode: "<red>Mode <dark_red>%1</dark_red> does not exist. Available modes are 'proxy' (or 'p'), 'server' (or 's') and 'all' (or 'a')."
  not-sign: "<red>You're not looking at a sign."
  sign-not-found: "<red>Sign group <dark_red>%1</dark_red> not found! <gray><italic>Note: It's case sensitive. Use TAB to all the available options.</italic>"
  database-invalid-mode: "<red>Mode <dark_red>%1</dark_red> does not exist. Available modes are 'upload' (or 'u') and 'download' (or 'd')."
  database-not-supported: "<red>This command isn't supported on local storage."
  not-available-on-spigot: "<red>This action isn't available on Spigot when using a proxy. Please run this through your proxy instead."
  only-console: "<red>This command can only be executed from the server console."
help:
  menu:
    - "<dark_gray>-------[ <aqua><bold>Triton</bold></aqua> ]-------"
    - "<aqua>Available commands:"
    - "%1"
  menu-item: "<aqua>/%1 <dark_aqua>%2 <dark_gray><bold>-</bold></dark_gray> <white>%3"
  getflag: "<gray>Use <aqua>/%1 getflag <language name>"
  setlanguage: "<gray>Use <aqua>/%1 setlanguage <language name> [player]"
  sign: "<gray>Use <aqua>/%1 sign <set|remove> <group key (set only)></aqua> to add a sign to a group."
  database: "<gray>Use <aqua>/%1 database <upload/download/u/d>"
  loglevel: "<gray>Use <aqua>/%1 loglevel [number]"
command:
  help: "Displays this message"
  getflag: "Gives the flag (banner) of a language to you"
  openselector: "Opens a GUI where you can change your language"
  reload: "Reloads the plugin"
  setlanguage: "Changes the language of a player"
  sign: "Adds or removes signs from sign groups"
  twin: "Uploads/downloads your config to/from TWIN for easy configuration"
  database: "Uploads/downloads translations to/from a database"
  info: "Shows information about the plugin (version, author, storage, etc)"
  loglevel: "See or change Triton's log level temporarily"
  debug: "Debugging tools (use upon request from the developer)"
success:
  getflag: "<aqua>You received the <gray>%1</gray> flag!"
  selector: "<aqua>Your language has been changed to <gray>%1"
  reload: "<aqua>Config on server successfully reloaded"
  proxy-reload: "<aqua>Config on proxy successfully reloaded"
  setlanguage: "<aqua>Your language has been changed to <gray>%1"
  setlanguage-others: "<aqua><gray>%1</gray>'s language has been changed to <gray>%2</gray>"
  detected-language: "<aqua>Your language has been automatically set to <gray>%1</gray>"
  sign-set: "<aqua>Sign successfully added to group <gray>%1</gray>"
  sign-remove: "<aqua>Successfully removed sign from all groups"
  database: "<aqua>Operation successful"
  current-loglevel: "<green>Triton is currently outputting at log level %1"
  set-loglevel: "<green>Triton's log level has been changed to %1 until the plugin is reloaded"
twin:
  failed-behind-proxy: "<red>Can't upload the config because you have behind-proxy enabled on config! Please execute this command through your proxy instead."
  no-internet: "<red>Failed to upload config. Please check your internet connection and/or firewall! Error description: %1"
  failed-fetch: "<red>Failed to fetch the config: <gray>%1"
  failed-upload: "<red>Failed to upload the config: <gray>%1"
  incorrect-status: "<gray>status is not 200 (received <red>%1</red>)"
  connecting: "<aqua>Connecting to TWIN... Please wait"
  uploaded: "<aqua>Your config is live! Start editing now at <dark_aqua>%1"
  success: "<aqua>Successfully fetched the config from TWIN and applied it into the server!"
  no-token: "<red>Invalid token! Please check if TWIN is setup correctly on config."
  repeated-download: "<red><bold>WARNING</bold> You're trying to download the same config twice! This might break the translation files. If you want to bypass this message, just execute the same command again."
  failed-collection-save: "<red>Error while saving collections to storage. Check the console for error details."
  suggestion-wrong-command: "<red>Did you mean to execute <aqua>%1</aqua> instead?"
other:
  selector-gui-name: "<aqua>Select a language"
  selector-gui-prev: "<aqua>Previous"
  selector-gui-forward: "<aqua>Next"
  selector-gui-currentpage: "<aqua>Page <dark_aqua>%1</dark_aqua> of <dark_aqua>%2</dark_aqua>"
  selected: "<aqua>Currently selected"
  database-loading: "<aqua>Performing operation..."
debug:
  prefix: "<aqua>[Triton @ <bold>%1</bold>] <reset>%2"
  target-platform:
    missing: "<red>You must provide one of the following target platforms: <dark_red>%1"
    invalid: "<red>Invalid target platform '<dark_red>%1</dark_red>'. Available platforms: <dark_red>%2</dark_red>"
  subcommand:
    missing: "<red>You must provide one of the following subcommands: <dark_red>%1</dark_red>"
    invalid: "<red>Invalid subcommand '<dark_red>%1</dark_red>'. Available subcommands: <dark_red>%2</dark_red>"
  dump:
    action:
      missing: "<red>You must provide one of the following actions for dump: <dark_red>%1</dark_red>"
      invalid: "<red>Invalid action '<dark_red>%1</dark_red>'. Available actions for dump: <dark_red>%2</dark_red>"
    player:
      missing: "<red>You must provide a player name, a UUID, 'me' or 'all'"
      me-not-player: "<red>Only players can use 'me'"
      not-found: "<red>Player '<dark_red>%1</dark_red>' could not be found"
    type:
      not-found: "<red>Type '<dark_red>%1</dark_red>' not found. Available types: <dark_red>%2</dark_red>"
    success:
      add:
        player: "<green>Enabled dumping (<gold>%1</gold>) for player with UUID <gold>%2</gold>"
        all: "<green>Enabled dumping (<gold>%1</gold>) for all players"
      remove:
        player: "<green>Disabled dumping (<gold>%1</gold>) for player with UUID <gold>%2</gold>"
        all: "<green>Disabled dumping (<gold>%1</gold>) for all players"
    clear: "<green>Disabled dumping for everyone"
  load:
    dump-file:
      missing: "<red>You must provide a dump name (name of file under plugins/Triton/dumps)"
      not-found: "<red>Cannot open dump file '<dark_red>%1</dark_red>': <dark_red>%2</dark_red>"
      invalid-json: "<red>Failed to parse message JSON in dump file: <dark_red>%1"
    line-number:
      invalid: "<red>Provided line number '<dark_red>%1</dark_red>' is not a valid number"
    success:
      sent: '<green>Sent <gold>%1</gold> message(s)!'
  info:
    error: "<red>There was an error dumping info about the plugin. See console for details."
    success: "<green>Dumped plugin info to <plugin dir>/%1"

info-command:
  - "<dark_gray>-------[ <aqua><bold>Triton</bold></aqua> ]-------"
  - "<aqua>Version: <gray>%1"
  - "<aqua>Developed by: <gray>%2"
  - "<aqua>Storage in use: <gray>%3"
  - "<aqua>Using proxy: <gray>%4"
