name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  libby-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      - name: Install nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generate libby json
        run: ./gradlew genLibbyLibsJson

      - name: Generate libby zip
        run: nix-build ./build-support/gen-libby-zip.nix -A libsZip --argstr tritonVersion ${{github.event.release.tag_name}}

      - name: Upload zip to release
        run: gh release upload ${{github.event.release.tag_name}} ./result/*.zip
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
