name: Release

on:
  release:
    types: [published]

jobs:
  libby-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Install nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generate libby json
        run: ./gradlew genLibbyLibsJson

      - name: Generate libby zip
        run: nix-build ./build-support/gen-libby-zip.nix -A libsZip --argstr tritonVersion ${{github.event.release.tag_name}}

      - name: Upload zip to release
        run: gh release upload ${{github.event.release.tag_name}} ./result/*.zip
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
  publish-api-javadocs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Publish package
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_diogotcRepositoryUsername: github-ci-triton
          ORG_GRADLE_PROJECT_diogotcRepositoryPassword: ${{ secrets.MAVEN_REPO_SECRET }}
