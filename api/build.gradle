plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.rexcantor64.triton'

apply from: '../gradle/publish.gradle'

dependencies {
    compileOnly libs.spigot.api
    compileOnly libs.bungeecord.api

    compileOnly libs.adventure.api
    compileOnly libs.adventure.serializer.bungeecord
}

task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}

task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

jar {
    from sourceSets.main.output
    manifest {
        attributes 'Automatic-Module-Name': 'com.rexcantor64.triton.api'
    }
}

artifacts {
    archives javadocJar
    archives sourcesJar
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.links(
            'https://hub.spigotmc.org/javadocs/spigot/',
            'https://jd.papermc.io/waterfall/1.21/', // Use Waterfall's JavaDocs instead of Bungee's since those are broken
            'https://docs.oracle.com/en/java/javase/21/docs/api/',
            'https://jd.advntr.dev/text-minimessage/4.26.1/'
    )

    // Disable the crazy super-strict doclint tool in Java 8
    options.addStringOption('Xdoclint:none', '-quiet')

    // Mark sources as Java 8 source compatible
    options.source = '8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifact sourcesJar
            artifact javadocJar
        }
    }
}
